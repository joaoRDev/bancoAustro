# Archivo de configuracion personalizado de ejemplo
# Uso: ./start.sh application-custom.properties

# Puerto HTTP personalizado
quarkus.http.port=15050
quarkus.http.test-port=15055

# Permitir conexiones inseguras
quarkus.http.insecure-requests=enabled

# CORS personalizado
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:8080
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=*

# Configuracion de logs personalizada
quarkus.log.file.enable=true
quarkus.log.file.path=logs/banco-austro-custom.log
quarkus.log.file.level=DEBUG
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=3
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.async=true

# Log nivel consola
quarkus.log.console.level=DEBUG

# Configuracion de tarea periodica personalizada
# Cada 2 minutos: 0 */2 * * * ?
pokemon.scheduler.cron=0 */2 * * * ?
pokemon.scheduler.strategy=circuitbreaker