# Puerto HTTP
quarkus.http.port=15050
quarkus.http.test-port=15055

# Permitir conexiones inseguras
quarkus.http.insecure-requests=enabled

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=*

# Configuracion de logs
quarkus.log.file.enable=true
quarkus.log.file.path=logs/application.log
quarkus.log.file.level=INFO
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=3
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.async=true

# Log nivel consola
quarkus.log.console.level=INFO

# Configuracion cliente REST Pokemon API
pokemon-api/mp-rest/url=https://pokeapi.co
pokemon-api/mp-rest/scope=jakarta.inject.Singleton

# Configuración de timeouts
quarkus.rest-client.pokemon-api.connect-timeout=5000
quarkus.rest-client.pokemon-api.read-timeout=10000

# Configuración de tarea periódica
# Cada 5 minutos: 0 */5 * * * ?
pokemon.scheduler.cron=0 */5 * * * ?
pokemon.scheduler.strategy=retry

# Configuración OpenAPI/Swagger
quarkus.smallrye-openapi.info-title=Banco del Austro API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API para concatenación de parámetros y consulta de Pokemon API
quarkus.smallrye-openapi.info-contact-name=Banco del Austro
quarkus.smallrye-openapi.info-license-name=MIT

# Swagger UI solo en desarrollo
%dev.quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=false